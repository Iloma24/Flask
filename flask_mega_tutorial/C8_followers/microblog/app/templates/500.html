<!-- это шаблон для функции-обработчика ошибки 500  -->
{% extends "base.html" %}  <!-- команда extends - указывает на наследование родительского (базового) шаблона -->

{% block content %} <!-- указывает на заполнение пустого родительского блока шаблоном с именем content -->
    <h1>An unexpected error has occurred</h1>  <!-- заголовок 1 степени важности. Название страницы -->
    <p>The administrator has been notified. Sorry for the inconvenience!</p>  <!-- абзац и информационное сообщение -->
    <p><a href="{{ url_for('index') }}">Back</a></p>  <!-- p - текстовый абзац, a - ссылка для перехода на главную страницу -->
{% endblock %}
