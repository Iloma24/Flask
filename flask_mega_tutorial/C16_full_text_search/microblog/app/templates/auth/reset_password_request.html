{#<!-- данный шаблон отрисовывает страницу ЗАПРОСА сброса пароля. На этой странице пользователь вводит свой адрес электронной
почты (Email), чтобы система отправила ему письмо со ссылкой для восстановления доступа -->#}
{% extends "base.html" %}  {#<!-- импорт родительского шаблона -->#}
{% import "bootstrap_wtf.html" as wtf %}  {#<!-- Импортирует вспомогательный шаблон библиотеки Flask-Bootstrap для быстрой
																					генерации красивых HTML-форм -->#}
{% block content %}  {#<!-- инструкция для заполнения блока content в родительском шаблоне -->#}
	<h1>{{ _('Reset Password') }}</h1>  {#<!-- заголовок страницы. Функция _() выполняет перевод	текста на предпочитаемый
																		пользователем	язык -->#}
	{{ wtf.quick_form(form) }} {#<!-- Автоматически отрисовывает HTML-форму на основе переданного из Flask объекта form (обычно
										класса ResetPasswordForm, передается через функцию render_template). Макрос создаст поля для ввода
										нового пароля, его подтверждения и кнопку	отправки, применив к ним стили Bootstrap -->#}
{% endblock %}
