<!-- данный шаблон отрисовывает страницу сброса пароля -->
{% extends "base.html" %}  <!-- импорт родительского шаблона -->

{% block content %}  <!-- инструкция для заполнения блока в родительском шаблоне -->
    <h1>Reset Password</h1>  <!-- заголовок страницы -->
    <form action="" method="post">  <!-- создание HTML-формы. action="" - означает, что данные отправятся на тот же URL,
                                        на котором находится пользователь. method="post" - указывает на тип HTML-запроса -->
        {{ form.hidden_tag() }} <!-- генерирует скрытые поля формы, включая CSRF-токен для защиты от атак типа «межсайтовая подделка запроса» -->
        <p>
            {{ form.email.label }}<br>  <!-- название поля. Тег <br> устанавливает перевод строки в том месте, где этот
                                        тег находится. В отличие от тега абзаца <p>, использование тега <br> не добавляет
                                        пустой отступ перед строкой -->
            {{ form.email(size=64) }}<br>  <!-- устанавливается размер поля для ввода в символах -->
            {% for error in form.email.errors %}  <!-- Если пользователь ввел некорректный email (например, забыл значок
                                            @) или оставил поле пустым, Flask-WTF вернет ошибки валидации. Этот цикл
                                            переберет их все и выведет под полем ввода красным цветом -->
            <span style="color: red;">[{{ error }}]</span>  <!-- тег span позволяет настраивать строку отдельно от остальных строк -->
            {% endfor %}
        </p>
        <p>{{ form.submit() }}</p>  <!-- кнопка подтверждения действия -->
    </form>
{% endblock %}
